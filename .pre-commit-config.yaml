fail_fast: false
repos:
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [
          -i,
          --style=Google
        ]
      - id: clang-tidy
        args: [
          -p=build,
          -fix-errors
        ]
      - id: cpplint
        args: ["--filter=-legal/copyright"]