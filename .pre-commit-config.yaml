fail_fast: false
repos:
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [
          -i,
          --style=file
        ]
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 6.3.3
    hooks:
        - id: buildifier
        - id: buildifier-lint